# Daily episode sync — notify-only when YouTube blocks the runner.
#
# Without this, a new Market Bubble episode only reaches the index when
# someone remembers to run the script — and lexthedev.com reports the
# episode count live, so a stale index becomes a number that is confidently
# wrong on a page whose whole premise is that it just checked.
#
# GitHub rather than Render: this needs yt-dlp and a few minutes of CPU, and
# a failed run here sends an email instead of disappearing into a log nobody
# reads.
#
# KNOWN LIMIT, on purpose. GitHub's runners are datacentre IPs and YouTube
# refuses full extraction from them — the channel listing works, fetching a
# video does not. So this reliably detects a new episode and reliably tells
# you, but often cannot index it itself. When that happens the run fails,
# you get an email, and one command locally finishes the job:
#
#     .venv/bin/python scripts/sync_latest.py
#
# The alternatives were both worse today: cookies in a secret expire every
# few weeks and trade a visible failure for a silent one, and a residential
# proxy costs $5-15/month for something that happens weekly. Revisit if the
# episode cadence goes up.
name: sync episodes

on:
  schedule:
    # Daily at 06:00 UTC. Episodes drop on Thursdays, so a Thursday upload is
    # indexed by Friday morning at the latest.
    #
    # A run with nothing new to do costs one channel listing, which is NOT
    # proxied (see fetch_episodes.latest_ids), so a quiet day spends no proxy
    # bandwidth. Only a real fetch does, and that happens once per episode
    # however often we look — running more often would not cost anything, it
    # would just add noise to the Actions tab.
    #
    # GitHub's scheduler is best-effort and fires late in practice; observed
    # runs land 40-100 minutes after the nominal time. That is fine for a
    # weekly show.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "How many of the newest videos to scan"
        default: "8"

concurrency:
  # Two syncs at once would fetch and embed the same episode twice. Ingest
  # is idempotent so nothing corrupts, but it doubles the bill for nothing.
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Always the newest yt-dlp: YouTube changes its bot check often
          # enough that a pinned version is the usual cause of a dead run.
          pip install --upgrade yt-dlp

      - name: Sync
        env:
          # Residential exit IP. Without it YouTube refuses this runner: both
          # the video page and the captions endpoint answer with the bot
          # check, measured on 14 Aug 2026. Unset, the sync still runs and
          # still detects new episodes -- it just cannot fetch them, which is
          # the notify-only behaviour this workflow had before.
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: bullpen-concierge
        run: |
          # --cookies none: no browser here to read them from. The script
          # already knows what is indexed by asking Pinecone, so a fresh
          # checkout does not re-fetch the back catalogue.
          python scripts/sync_latest.py --cookies none \
            --check "${{ github.event.inputs.check || '8' }}"

      - name: Confirm the live index
        if: always()
        run: |
          # The deployed service is what the world sees, so end by asking it
          # rather than trusting the step above.
          n=$(curl -s --max-time 60 https://search.lexthedev.com/v1/podcast/episodes \
              | python -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "search.lexthedev.com now reports $n episodes"
          if [ "${{ job.status }}" != "success" ]; then
            echo ""
            echo "::warning::Sync could not index an episode from this runner."
            echo "This is the known datacentre-IP limit, not a code failure."
            echo "Finish it locally:  .venv/bin/python scripts/sync_latest.py"
          fi
