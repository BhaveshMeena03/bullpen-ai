<!DOCTYPE html>
<!-- Source for the @mbubbleSearch X header (1500x500).
     Re-render after edits: node scripts/make_x_banner.mjs

     Two things constrain the layout more than taste does:

     The avatar sits over the bottom-left corner, roughly 250px square and
     hanging below the banner, so nothing important goes there. Everything
     lives in the middle 1000px.

     X crops the banner shorter on narrow viewports, taking it off the top
     and bottom. So the block is vertically centred and the bottom 90px is
     left empty rather than filled.

     The old header named one archive. There are three now, and the count
     is the thing worth saying, because "searchable" without a size is a
     claim anyone can make. -->
<html><head><meta charset="utf-8"><style>
  @font-face{font-family:Inter;src:url("fonts/Inter-Variable.ttf");
    font-weight:100 900}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1500px;height:500px;background:#0b0e11;color:#e6e8ea;
    font-family:Inter,-apple-system,sans-serif;position:relative;
    overflow:hidden;display:flex;align-items:center;justify-content:center}

  /* Same green pool as the site, placed high so the crop keeps it. */
  .glow{position:absolute;left:50%;top:-260px;width:1100px;height:620px;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle,#16c78426,transparent 70%)}
  .glow.b{left:88%;top:-180px;width:600px;height:480px;
    background:radial-gradient(circle,#16c7841a,transparent 70%)}

  .col{position:relative;width:1120px;text-align:center;padding-bottom:150px}

  .eyebrow{font-size:15px;font-weight:600;letter-spacing:.34em;
    text-transform:uppercase;color:#16c784;margin-bottom:18px}

  /* One line. It wraps at 62 and the orphaned word looks like a mistake. */
  h1{font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1.04;
    margin-bottom:12px;white-space:nowrap}
  h1 em{color:#16c784;font-style:normal}

  .sub{font-size:21px;color:#8a939e;margin-bottom:30px}

  /* The site's readout strip, same idea: a number, then what it counts.
     Counts rather than hours across all three, because the only honest
     hours figure for the broadcast would have to explain that the live
     capture and the YouTube cut of one show overlap. A banner is not the
     place for a footnote.

     Narrower than the headline and centred, so the left cell clears the
     avatar. The avatar reaches about x=394 and y=335 on a 1500x500 frame;
     measured off the live profile, not guessed. */
  .readout{display:grid;grid-template-columns:repeat(3,1fr);
    width:880px;margin:0 auto;
    border-top:1px solid #232a33;padding-top:20px}
  .cell{border-right:1px solid #232a33}
  .cell:last-child{border-right:0}
  .n{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;
    line-height:1;margin-bottom:8px}
  .n span{font-size:19px;font-weight:600;color:#8a939e;margin-left:6px}
  .who{font-size:13px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:#16c784;margin-bottom:6px}
  .note{font-size:14px;color:#5d6771}
</style></head><body>
  <div class="glow"></div>
  <div class="glow b"></div>
  <div class="col">
    <div class="eyebrow">Market Bubble &middot; Search</div>
    <h1>Ask anything. Jump to the <em>exact second.</em></h1>
    <div class="sub">Three archives, transcribed and searchable by meaning.</div>
    <div class="readout">
      <div class="cell">
        <div class="n">18 <span>episodes</span></div>
        <div class="who">Market Bubble</div>
        <div class="note">every show, plus the live cuts</div>
      </div>
      <div class="cell">
        <div class="n">11 <span>interviews</span></div>
        <div class="who">Elon Musk</div>
        <div class="note">2018&ndash;2025 &middot; 31.8 hours</div>
      </div>
      <div class="cell">
        <div class="n">458 <span>episodes</span></div>
        <div class="who">MCG Live</div>
        <div class="note">444 hours &middot; one project each</div>
      </div>
    </div>
  </div>
</body></html>
