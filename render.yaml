# Render blueprint — deploy with "New > Blueprint" at dashboard.render.com.
# Secrets (sync: false) are entered once in the Render dashboard; they never
# live in the repo.
services:
  - type: web
    name: marketbubble-search
    runtime: docker
    # Paid tier: the free one sleeps when idle, and a bot that only
    # answers while someone happens to be browsing the site is not a bot.
    #
    # standard rather than starter, for two reasons. The blueprint has to
    # agree with the dashboard or a sync fails on the mismatch; and the
    # clip renderer needs the headroom — a max-quality encode peaks near
    # 1GB of RSS, and starter is a 512MB box, so it does not run slowly
    # there, it gets OOM-killed mid-render. Measured: ~2.2 CPU-seconds per
    # second of output, so a 45s clip is ~100 CPU-seconds, about a minute
    # and a half on this one core. MAX_CONCURRENT=1 in app/clipper.py is
    # what keeps that a queue instead of a crash.
    plan: standard
    healthCheckPath: /healthz
    autoDeploy: true
    # Pinned, so that experimental work can live on a branch without any
    # question about whether pushing it reaches production.
    branch: main
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # The usepod proxy URL carries its auth token in the path, so the
      # value belongs in the dashboard and never in this file.
      #
      # Declared here anyway, as a stub. It was set in the dashboard and
      # absent from the blueprint, and a blueprint sync can prune what the
      # file does not know about -- which would route every answer back to
      # Anthropic without anything failing or anyone noticing.
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: PINECONE_INDEX
        value: bullpen-concierge
      # These OVERRIDE the defaults in app/config.py — pydantic gives the
      # environment precedence. Change them here as well, or a code-only edit
      # silently does nothing in production.
      # 12 was sized when a search cost $0.0044. It is a throughput limit,
      # not a spend limit — the daily budget below is what bounds money —
      # and at 12 a visitor clicking through the example questions could
      # trip it while doing exactly what the page invites.
      - key: RATE_LIMIT_RPM
        value: "30"
      - key: GLOBAL_RATE_LIMIT_RPM
        value: "400"
      # A spend ceiling, not a safety limit: roughly $0.016 per search, so
      # this is the most the service can cost in a day. Raised from 3000 the
      # morning the podcast's hosts started sharing it — being told "closed"
      # is a worse outcome than the bill on the one day that matters. Lower
      # it again when the spike passes.
      # Sized in requests, so it silently tightened when a request got
      # cheaper. 6000 was $26/day at Anthropic's rates; on the proxy the
      # same 6000 costs $10.54, so the ceiling that was accepted as
      # reasonable now stops the service at 40% of the spend it was set to
      # allow. 15000 restores the DOLLAR ceiling that was actually chosen.
      - key: DAILY_REQUEST_BUDGET
        value: "15000"
      # No single client may take more than this slice of the budget above.
      # 200 was sized against abuse, when the only question was whether one
      # attacker could drain the budget. The real risk now is a good day: at
      # 200 apiece, fifteen enthusiastic people exhaust the whole 3000 and
      # everyone after them is told the service is closed. 60 still allows a
      # thorough evaluation — more than anyone reaches by browsing — while
      # letting the same budget reach fifty times as many people.
      # 60 was sized when the only caller was a person browsing. It is also
      # what a verification run spends in one pass, so the owner of the site
      # could not use his own demo — and most of what that run spent went on
      # cache hits, which cost nothing and are now refunded rather than
      # charged. 400 with free answers no longer counted is a smaller real
      # allowance than 60 was, not a larger one.
      # Same arithmetic: 400 requests was $1.76 of the budget, and is now
      # $0.70. 1000 is the same slice of the same money.
      - key: PER_CLIENT_DAILY_BUDGET
        value: "1000"

      # --- X mention bot -------------------------------------------------
      # Runs inside this service rather than a worker of its own: it shares
      # the PodcastIndex built at startup, and going over HTTP would put it
      # behind this app's own per-client limiter, competing with visitors
      # for the daily budget above.
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: X_BOT_USER_ID
        value: "2091231768200499200"
      # The switch, and deliberately NOT managed by this file.
      #
      # It carried value: "false" here, and every blueprint sync reset it —
      # so each deploy silently switched the bot off again after it had been
      # turned on in the dashboard. Six deploys in an afternoon, and the
      # account went quiet after each one with nothing in the logs to say
      # why, because from the app's point of view nothing was wrong.
      #
      # sync: false hands it to the dashboard for good. A switch a person
      # operates should not also be declared in a file that overwrites it.
      - key: X_BOT_ENABLED
        sync: false
      # off | seekable | always.
      #
      # A reply with a URL costs $0.200 against $0.015 whatever it links to,
      # and only a YouTube link actually jumps to the moment — which is the
      # argument for "seekable", and it is a real one.
      #
      # "always" anyway, because the saving is not the point yet. An X link
      # renders a video card carrying the episode title and thumbnail, and a
      # reply that looks like something beats a reply that saves $0.185
      # while the people deciding whether this is worth funding are the ones
      # reading it. Revisit when volume matters more than appearance.
      - key: X_BOT_INCLUDE_LINKS
        value: "always"
      # Two automated accounts in one thread answer each other forever.
      # @clawpumptech is a bot too: its reply mentioned this account, that
      # reply mentioned it back, and nine messages later both were still
      # paying per message in somebody else's thread.
      - key: X_BOT_PER_THREAD_CAP
        value: "5"
      - key: X_BOT_DAILY_REPLY_CAP
        value: "500"
      # The ceiling the reply cap is not: a mention read costs $0.001
      # whether or not it is answered, and how often the account is tagged
      # is somebody else's decision. This bounds the day regardless.
      # Raised alongside the reply cap, because it binds first. Internal
      # accounting now charges a reply at the observed $0.015 rather than
      # the published $0.200 for a URL, because months of billing show a
      # mention-gated reply costs the same either way.
      #
      # At 300 replies that is $4.50 of posting plus the reads, so $12
      # leaves room and still stops a runaway well short of real money.
      # The model calls are separate and not counted here: roughly $0.008
      # an answer, so about $2.40 more at a full day of 300.
      - key: X_BOT_DAILY_SPEND_CAP_USD
        value: "20.0"
      # Answer only badged accounts. Filters throwaway spam; also ignores
      # genuine people who do not pay X for a checkmark. On while the reply
      # quality is still being watched, and announced as such — "open to
      # everyone soon" is a promise, so it has to be true that it is not
      # open to everyone yet.
      # Open to everyone. It ran verified-only while the guards that gate
      # kept by accident did not exist yet -- it bounded reply volume, and
      # it meant the text reaching the model came from people with
      # something to lose. Both are now done on purpose:
      #
      #   X_BOT_PER_AUTHOR_CAP  one account's share of the day, checked
      #                         before any retrieval spend
      #   strip_model_links     no URL the model wrote survives into a
      #                         reply; only ones this code built from a
      #                         cited hit
      #   attribution.correct   a quote whose voice label contradicts the
      #                         host named is demoted to "one of the
      #                         hosts" rather than posted as a false
      #                         claim about a real person
      #
      # Set back to "true" to close it again -- no deploy, and the next
      # poll honours it.
      - key: X_BOT_VERIFIED_ONLY
        value: "false"
      # Replies one ACCOUNT gets in a day. The per-thread cap never bounded
      # this: thirty mentions in thirty threads is thirty conversations and
      # no repeats, so one person could take the whole daily 300. Priority
      # authors are exempt.
      - key: X_BOT_PER_AUTHOR_CAP
        value: "11"
      # Premium accounts can post far past 280, and automated accounts get
      # the same allowance as human ones. Confirmed by posting one: a
      # 900-character reply went out fine. 1500 rather than the 25,000 the
      # tier allows, because the model stops when the answer is complete and
      # a higher ceiling would only ever buy walls of text.
      - key: X_BOT_POST_LIMIT
        value: "1500"
      # Summaries already exist and run to ~3,100 characters. Trimming one
      # to answer size would cut the back half of an episode off.
      - key: X_BOT_SUMMARY_LIMIT
        value: "4000"
      # Never met with silence: @TheGreatCattsby, @Banks, @blknoiz06,
      # @MarketBubble, @Lexx_eth. Ids because that is what a mention
      # carries, and a handle can change hands.
      - key: X_BOT_SITE
        value: "search.lexthedev.com"
      - key: X_BOT_PRIORITY_AUTHORS
        value: "948689053,363811679,973261472,1729276822485889024,1070767274808696832"
      # Nearly all the latency was here. Answering takes 4-8 seconds; at 60s
      # a mention waited up to 84 just to be noticed. Polling is free — X
      # charges per resource returned and deduplicates within the UTC day —
      # so this is 20, not lower, because a reply three seconds after the
      # question reads as a machine.
      - key: X_BOT_POLL_SECONDS
        value: "20"
      - key: X_BOT_CONTRACT_ADDRESS
        value: "8VjFid8BVGcTPpUzf4PAWsA5nHJ5h2GQNXPEjyr2mF7t"
      - key: X_BOT_TOKEN_LABEL
        value: "MarketBubbleSearch"
