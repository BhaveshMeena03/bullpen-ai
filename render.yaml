# Render blueprint — deploy with "New > Blueprint" at dashboard.render.com.
# Secrets (sync: false) are entered once in the Render dashboard; they never
# live in the repo.
services:
  - type: web
    name: marketbubble-search
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: PINECONE_INDEX
        value: bullpen-concierge
      # These OVERRIDE the defaults in app/config.py — pydantic gives the
      # environment precedence. Change them here as well, or a code-only edit
      # silently does nothing in production.
      - key: RATE_LIMIT_RPM
        value: "12"
      - key: GLOBAL_RATE_LIMIT_RPM
        value: "240"
      - key: DAILY_REQUEST_BUDGET
        value: "3000"
      # No single client may take more than this slice of the budget above.
      - key: PER_CLIENT_DAILY_BUDGET
        value: "200"
